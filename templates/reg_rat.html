{% extends 'base.html' %}

{% block title %}Таблицы{% endblock %}

{% block content %}
<div class="bg-neutral-50 min-h-screen py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Grid Header Section -->
        <div class="border-b border-neutral-200 pb-5 flex flex-col md:flex-row md:items-center md:justify-between space-y-4 md:space-y-0">
            <div>
                <h1 class="text-3xl font-display font-extrabold tracking-tight text-neutral-900">Результаты</h1>
                <p class="text-sm text-neutral-500 mt-1">Просматривайте результаты</p>
            </div>
        </div>
        <div class="mt-6 bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm">
            <form action="{{ url_for('reg_rat') }}" method="GET" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">

                <!-- Category Select Filter (Keep active_category persistent) -->
                <div class="col-span-1 md:col-span-3">
                    <label class="block text-xs font-semibold uppercase text-neutral-400 font-display mb-1">Тур</label>
                    <select id="category" name="category" class="block w-full border-neutral-200 rounded-xl text-sm bg-neutral-50 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <!--<option value="">Номер тура-->
                        </option>
                        {% for cat in ["Первый тур", "Второй тур"] %}
                            <option value="{{ cat }}" {% if active_category == cat %}selected{% endif %}>
                                {{cat}}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-span-1 md:col-span-3">
                    <label class="block text-xs font-semibold uppercase text-neutral-400 font-display mb-1">Статистика по</label>
                    <select id="stat" name="stat" class="block w-full border-neutral-200 rounded-xl text-sm bg-neutral-50 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="all" {% if sort_by == 'default' or not sort_by %}selected{% endif %}>Все участники</option>
                        <option value="participants">Участники</option>
                        <option value="half-winners">Призёры</option>
                        <option value="winners">Победители</option>
                        <option value="all-winners">Дипломы</option>
                    </select>
                </div>

                <!-- Filter Action Keys -->
                <div class="col-span-1 md:col-span-2 pt-5">
                    <button id="submit" class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none transition-colors shadow-sm">
                        Применить
                    </button>
                </div>
            </form>
        </div>

        <!-- Product Grid Main section -->
        <div id="mt-8" class="mt-8">
            {% if products %}
            {{ products | safe }}
            {% else %}
                <!-- Empty search catalog fallback state -->
                <div class="text-center py-20 bg-white rounded-2xl border border-neutral-200 shadow-sm max-w-md mx-auto mt-10">
                    <svg class="mx-auto h-12 w-12 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 01-6.364 0M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
                    </svg>
                    <h3 class="mt-2 text-sm font-semibold text-neutral-900">Ожидаем запрос</h3>

                </div>
            {% endif %}
        </div>

    </div>
</div>
<!--<script rel="static/render.js"></script>-->
<script>
    select = document.getElementById('category')
    stat = document.getElementById('stat')
    function qwerty(){
        table.innerHTML = fetch('http://127.0.0.1:5000/${select.selectIndex + 1}/${stat.selectIndex + 1}'
    }
</script>
{% endblock %}
